name: Workspace regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium
      - name: Run Node and real browser tests
        run: python tools/check_workspace.py
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-evidence
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
